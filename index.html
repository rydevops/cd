      UI.modal(`<div class="set"><h3>Paused</h3><div class="row"><span>Music</span><button class="tog ${st.music ? 'on' : ''}" data-act="tog" data-k="music"><i></i></button></div><div class="row"><span>Sound effects</span><button class="tog ${st.sfx ? 'on' : ''}" data-act="tog" data-k="sfx"><i></i></button></div>
<div class="row"><span>Battle speed</span><div class="seg"><button class="${st.speed === 1 ? 'on' : ''}" data-act="bspeed" data-v="1">Normal</button><button class="${st.speed === 2 ? 'on' : ''}" data-act="bspeed" data-v="2">Fast</button></div></div>
<div class="m-btns wrap"><button class="btn ghost" data-act="help">How to play</button><button class="btn ghost warn" data-act="forfeit">${B.tut ? 'Leave lesson' : 'Forfeit'}</button><button class="btn big" data-act="mclose">Resume</button></div></div>`, { cls: 'settings' });
    },
    bspeed(el) { const v = parseInt(el.dataset.v, 10); UI.save().settings.speed = v; B.speed = v; UI.persist(); $$('.seg button[data-act=bspeed]').forEach((b) => b.classList.toggle('on', b === el)); },
    forfeit() {
      if (B.tut) {
        UI.confirmBox('Leave the lesson?', 'You can replay it any time from the title screen or Options.', 'Leave', 'Keep learning', () => {
          UI.closeAllModals(); B.over = true; AU.stopMusic(0.2); const c = $('#coach'); if (c) c.hidden = true;
          UI.go(UI.save().started ? 'circuit' : 'title');
        });
        return;
      }
      UI.confirmBox('Forfeit this duel?', 'You will lose this duel and get no cards.', 'Forfeit', 'Keep fighting', () => {
        UI.closeAllModals(); B.over = true; UI.save().stats.losses++; UI.persist(); AU.stopMusic(0.2); UI.go('circuit');
      });
    },
    coachnext() {
      if (!B || !B.tut) return;
      const st = tutStep();
      if (!st || !st.say) return;
      AU.sfx('click');
      tutAdvance();
      tutStep();
      if (B.busy) { render(); return; }
      const p = E.who(B.s);
      if (p === ME) { render(); } else next();
    },
    rematch(el) { UI.closeAllModals(); UI.startDuel(parseInt(el.dataset.i, 10)); }
  };

  CD.Battle = { ACT, layout, _finish: () => finish(), get state() { return B; }, _render: render };
  if (typeof module !== 'undefined') module.exports = CD.Battle;

  UI.SCREENS.battle = { enter() { /* built by startDuel */ }, leave() { if (CD.FX) CD.FX.abort(); if (B) { B.over = true; clearTimeout(B.aiT); } const c = $('#coach'); if (c) c.remove(); } };
})(globalThis);

/* ===== update.js ===== */
/* Critter Duel — update checker.
   On open (and whenever the app comes back to the foreground) it fetches version.json bypassing every cache.
   If the published version differs from the one running, it updates: automatically from the title screen,
   with a prompt anywhere else, and never in the middle of a duel. Saves live in localStorage and are untouched. */
(function (root) {
  'use strict';
  const CD = (root.CD = root.CD || {});
  const doc = root.document;
  const KEY = 'critterduel.upd';
  const U = { state: 'idle', latest: null, last: 0, busy: false, asked: '' };
  const UI = () => CD.UI;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
  const local = () => ({ version: CD.VERSION || '0.0.0', build: CD.BUILD || '' });
  const idOf = (v) => v.version + '+' + (v.build || '');
  const parse = (v) => /^\d+\.\d+\.\d+/.test(v || '');

  function differs(remote) {
    const l = local();
    return remote.version !== l.version || !!(remote.build && l.build && remote.build !== l.build);
  }

  async function fetchRemote() {
    if (!root.fetch || !/^https?:/.test(root.location.protocol)) return null;
    const ctl = root.AbortController ? new root.AbortController() : null;
    const t = setTimeout(() => ctl && ctl.abort(), 7000);
    try {
      const r = await root.fetch('version.json?cb=' + Date.now(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined });
      if (!r.ok) return null;
      const j = await r.json();
      return j && parse(j.version) ? j : null;
    } catch (e) { return null; } finally { clearTimeout(t); }
  }

  /* ----- status text ----- */
  function line() {
    const v = 'v' + (CD.VERSION || '?');
    switch (U.state) {
      case 'checking': return v + ' · checking for updates…';
      case 'current': return v + ' · up to date';
      case 'available': return v + ' · update available: v' + U.latest.version + ' (tap to install)';
      case 'updating': return v + ' · updating…';
      default: return v;
    }
  }
  function detail() {
    switch (U.state) {
      case 'checking': return 'Checking for updates…';
      case 'current': return 'You have the latest version.';
      case 'available': return 'Version ' + U.latest.version + ' is available.';
      case 'updating': return 'Updating…';
      case 'unknown': return 'Could not reach the update server. You may be offline.';
      default: return '';
    }
  }
  function render() {
    if (!doc) return;
    doc.querySelectorAll('[data-upd=line]').forEach((el) => { el.textContent = line(); el.classList.toggle('avail', U.state === 'available'); });
    doc.querySelectorAll('[data-upd=detail]').forEach((el) => { el.textContent = detail(); });
  }

  /* ----- loop guard: never reload more than twice for the same target in one session ----- */
  function attempts(id) { try { const o = JSON.parse(root.sessionStorage.getItem(KEY) || '{}'); return o.id === id ? o.n : 0; } catch (e) { return 0; } }
  function bump(id) { try { root.sessionStorage.setItem(KEY, JSON.stringify({ id, n: attempts(id) + 1 })); } catch (e) { /* ignore */ } }

  /* ----- applying ----- */
  function overlay(v) {
    const app = doc.getElementById('app'); if (!app || doc.getElementById('upd-ov')) return;
    const d = doc.createElement('div'); d.id = 'upd-ov';
    d.innerHTML = '<div class="upd-box"><div class="upd-spin"></div><b>Updating to v' + v + '</b><span>Your cards and progress stay safe.</span></div>';
    app.appendChild(d);
  }
  async function apply(r) {
    if (U.state === 'updating') return;
    U.state = 'updating'; render(); overlay(r.version);
    bump(idOf(r));
    try { UI().flush(); } catch (e) { /* ignore */ }
    try { const reg = await root.navigator.serviceWorker.getRegistration(); if (reg) await Promise.race([reg.update(), sleep(3000)]); } catch (e) { /* ignore */ }
    try { const ks = await root.caches.keys(); await Promise.all(ks.map((k) => root.caches.delete(k))); } catch (e) { /* ignore */ }
    await sleep(350);
    // the query string makes the CDN fetch a fresh index.html instead of a cached copy
    root.location.replace(root.location.pathname + '?v=' + encodeURIComponent(idOf(r)));
  }

  function prompt() {
    if (U.state !== 'available' || !UI()) return;
    U.asked = idOf(U.latest);
    UI().modal('<div class="res"><h3>Update available</h3><p>Critter Duel <b>v' + U.latest.version + '</b> is ready (you have v' + (CD.VERSION || '?') + '). It takes a few seconds and keeps all your cards and progress.</p>' +
      '<div class="m-btns"><button class="btn ghost" data-act="mclose">Later</button><button class="btn big" data-act="doupdate">Update now</button></div></div>', { cls: 'small' });
  }

  function decide(manual) {
    if (U.state !== 'available') return;
    const screen = UI() && UI().current();
    const busyUI = !!doc.querySelector('.modal.on');
    if (manual) { prompt(); return; }
    if (screen === 'title' && !busyUI && attempts(idOf(U.latest)) < 2) { apply(U.latest); return; }
    if (['title', 'circuit', 'album', 'deck'].indexOf(screen) >= 0 && !busyUI && U.asked !== idOf(U.latest)) prompt();
  }

  async function check(o) {
    o = o || {};
    if (U.busy || U.state === 'updating') return U.state;
    if (!o.force && Date.now() - U.last < 30000) return U.state;
    U.busy = true; U.last = Date.now();
    if (U.state !== 'available') { U.state = 'checking'; render(); }
    const r = await fetchRemote();
    U.busy = false;
    if (!r) { if (U.state !== 'available') U.state = 'unknown'; }
    else if (differs(r)) { U.latest = r; U.state = 'available'; }
    else U.state = 'current';
    render();
    decide(!!o.manual);
    return U.state;
  }

  const ACT = {
    checkupd() {
      if (CD.Audio) CD.Audio.sfx('click');
      if (U.state === 'available') { prompt(); return; }
      check({ force: true, manual: true }).then((s) => { if (s !== 'available' && UI()) UI().toast(detail() || 'Up to date'); });
    },
    doupdate() { if (CD.Audio) CD.Audio.sfx('ok'); if (UI()) UI().closeAllModals(); if (U.latest) apply(U.latest); }
  };

  function onScreen(name) { if (U.state === 'available' && U.asked !== idOf(U.latest) && ['circuit', 'album', 'deck'].indexOf(name) >= 0) setTimeout(() => decide(false), 500); }

  function start() {
    // tidy the cache-busting query left by a previous update
    try { if (/[?&]v=/.test(root.location.search)) root.history.replaceState(null, '', root.location.pathname + root.location.hash); } catch (e) { /* ignore */ }
    doc.addEventListener('visibilitychange', () => { if (!doc.hidden) check(); });
    root.addEventListener('online', () => check({ force: true }));
    check({ force: true });
  }

  CD.Update = { start, check, line, detail, ACT, onScreen, state: U, _apply: apply };
})(globalThis);

/* ===== main.js ===== */
/* Bootstrap */
(function (root) {
  'use strict';
  const start = () => root.CD.init();
  if (root.document.readyState === 'loading') root.document.addEventListener('DOMContentLoaded', start);
  else start();
})(globalThis);

</script>
</body>
</html>
