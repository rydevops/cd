<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Critter Duel</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Critter Duel">
<meta name="theme-color" content="#1b1250">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="Critter Duel — collect creature cards, duel AI trainers and complete your album.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
/* Critter Duel — sticker-book arcade look. Mobile-first, iOS safe-area aware. */
:root{
  --ink:#1a1030;--night:#1b1250;--night2:#2d1b7a;--cream:#fff6e0;--cream2:#f3e3bd;--sun:#ffd23d;--sun2:#f0a800;
  --pink:#ff5fa2;--mint:#4fe0a8;--sky:#52b8ff;--red:#ff5a4d;--dim:#7d7399;
  --nav:58px;--navw:68px;
  --sat:env(safe-area-inset-top,0px);--sar:env(safe-area-inset-right,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);
  --font:ui-rounded,"SF Pro Rounded","Avenir Next Rounded","Nunito","Trebuchet MS",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);overscroll-behavior:none;position:fixed;inset:0;width:100%}
body{font-family:var(--font);font-weight:700;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;padding:0;margin:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default}
img{-webkit-user-drag:none;user-select:none;display:block}
h1,h2,h3,h4,p{margin:0}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#3a2a9a 0%,var(--night) 55%,#0e0a2e 100%)}
#probe{position:absolute;left:0;top:0;width:0;height:0;visibility:hidden;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#screens{position:absolute;inset:0}
.hub #screens{bottom:calc(var(--nav) + var(--sab))}
.hub.land #screens{bottom:0;left:calc(var(--navw) + var(--sal))}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:var(--sat) var(--sar) var(--sab) var(--sal);overflow:hidden}
.hub .screen{padding-bottom:0}
.hub.land .screen{padding-left:0;padding-bottom:var(--sab)}
.screen.on{display:flex;animation:scr .25s ease-out}
@keyframes scr{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:18px}

/* ---------- nav ---------- */
#nav{position:absolute;display:none;z-index:20;background:linear-gradient(#2a1a78,#1b1250);border-top:3px solid var(--ink)}
#nav.on{display:flex}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#b9aef0;font-size:11px;letter-spacing:.3px;position:relative}
#nav svg{width:26px;height:26px}
#nav button.cur{color:var(--sun)}
#nav button.cur::before{content:"";position:absolute;top:-3px;left:22%;right:22%;height:4px;background:var(--sun);border-radius:0 0 4px 4px}
#app:not(.land) #nav{left:0;right:0;bottom:0;height:calc(var(--nav) + var(--sab));padding:0 var(--sar) var(--sab) var(--sal)}
.land #nav{top:0;bottom:0;left:0;width:calc(var(--navw) + var(--sal));flex-direction:column;border-top:0;border-right:3px solid var(--ink);padding:var(--sat) 0 var(--sab) var(--sal)}
.land #nav button.cur::before{top:22%;bottom:22%;left:auto;right:-3px;width:4px;height:auto;border-radius:4px 0 0 4px}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 20px;border-radius:16px;background:var(--sun);color:var(--ink);font-size:16px;font-weight:900;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.big{min-height:56px;padding:0 30px;font-size:20px;border-radius:20px}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
.btn.ghost{background:var(--cream);}
.btn.warn{background:var(--red);color:#fff}
.btn.hot{background:linear-gradient(#ff8a5c,#ff5a4d);color:#fff;animation:hot 1.2s ease-in-out infinite}
.btn:disabled{background:#cfc6e6;color:#8c82ad;box-shadow:0 4px 0 #6d6390;border-color:#6d6390;animation:none}
@keyframes hot{50%{filter:brightness(1.18)}}

/* ---------- title ---------- */
.burst{position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.07) 0 10deg,transparent 10deg 20deg);animation:spin 60s linear infinite;pointer-events:none}
.burst.win{background:repeating-conic-gradient(from 0deg,rgba(255,210,61,.18) 0 10deg,transparent 10deg 20deg);animation-duration:40s}
.burst.dim{opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}
.tsky{position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 8%,#fff 0 1.5px,transparent 2.5px),radial-gradient(circle at 85% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 40% 30%,#ffd23d 0 1.5px,transparent 2.5px);opacity:.8}
#s-title{align-items:center;justify-content:center}
.t-main{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:0 20px}
.logo{display:flex;flex-direction:column;line-height:.88;font-size:min(22vw,92px);font-weight:900;letter-spacing:-1px;transform:rotate(-4deg);color:var(--sun);-webkit-text-stroke:0;text-shadow:0 5px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink),3px 3px 0 var(--ink),-3px 3px 0 var(--ink),3px -3px 0 var(--ink),-3px -3px 0 var(--ink),0 12px 24px rgba(0,0,0,.4)}
.logo span:last-child{color:var(--pink);margin-left:.5em;font-size:1.1em}
.tag{color:#e6defc;font-size:16px;text-shadow:0 2px 0 var(--ink)}
.t-btns{display:flex;flex-direction:column;gap:12px;align-items:stretch;min-width:min(260px,70vw)}
.t-ver{color:#a99bdc;font-size:12px}
.t-crits{position:absolute;inset:0;pointer-events:none}
.tc{position:absolute;width:min(34vw,170px);height:auto;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35));animation:bob 3.2s ease-in-out infinite}
.tc0{left:-2%;bottom:6%}.tc1{right:0;bottom:12%;animation-delay:-1s}.tc2{right:12%;top:5%;width:min(26vw,130px);animation-delay:-2s}.tc3{left:6%;top:8%;width:min(24vw,120px);animation-delay:-.6s}.tc4{left:42%;bottom:-3%;width:min(24vw,120px);animation-delay:-1.6s}
.land .tc0{left:6%;bottom:12%}.land .tc1{right:6%;bottom:10%}.land .tc2{right:22%;top:8%}.land .tc3{left:22%;top:8%}.land .tc4{display:none}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}

/* ---------- headers / chips ---------- */
.hbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px 8px;color:#fff}
.hbar h2{font-size:24px;text-shadow:0 3px 0 var(--ink)}
.hbar small{color:#cbbff5;font-size:12px;display:block;margin-top:1px}
.meter{flex:1;max-width:120px;height:12px;border:3px solid var(--ink);border-radius:8px;background:#0e0a2e;overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun))}
.stepper{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.28);border-radius:14px;padding:4px 6px 4px 12px;font-size:12px}
.stepper b{min-width:22px;text-align:center;font-size:18px;color:var(--sun)}
.stepper button{color:var(--ink);width:36px;height:36px;border-radius:12px;background:var(--cream);border:3px solid var(--ink);font-size:20px;font-weight:900;line-height:1;box-shadow:0 3px 0 var(--ink)}
.stepper button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.warnbar{margin:0 14px 6px;padding:8px 12px;border-radius:12px;background:#ff9a3d;color:var(--ink);border:3px solid var(--ink);font-size:13px;text-align:left}
.chips{display:flex;gap:6px;padding:2px 14px 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;min-width:34px;padding:0 12px;border-radius:17px;background:rgba(255,255,255,.12);color:#d9d0fa;font-size:13px;border:2px solid transparent;display:flex;align-items:center;justify-content:center}
.chip.on{background:var(--sun);color:var(--ink);border-color:var(--ink)}
.chip.ico{padding:0 6px}
.chip .en{width:22px;height:22px}

/* ---------- energy / status ---------- */
.en{display:inline-block;width:1.3em;height:1.3em;vertical-align:-.3em;flex:none}
.en.sm{width:1.1em;height:1.1em;vertical-align:-.2em}
.en.xs{width:.95em;height:.95em;vertical-align:-.15em}
.stbadge{display:inline-block;font-size:.6em;line-height:1;padding:.22em .4em;border-radius:.5em;color:#fff;border:1.5px solid var(--ink);font-weight:900;letter-spacing:.2px}

/* ---------- type colours ---------- */
.t-F{--c1:#ffb07a;--c2:#c4361c;--glow:#ff7a45}
.t-T{--c1:#8fd0ff;--c2:#1d5fb8;--glow:#3fa7ff}
.t-L{--c1:#a8ecaa;--c2:#2b8a46;--glow:#5fd16f}
.t-V{--c1:#ffe98a;--c2:#c48a12;--glow:#ffd84a}
.t-I{--c1:#d4f6ff;--c2:#4aa3d6;--glow:#8fe3ff}
.t-S{--c1:#e0c79a;--c2:#7a5a32;--glow:#c9a46a}
.t-D{--c1:#c1a6ff;--c2:#46288a;--glow:#9d78ff}
.t-C{--c1:#ffd0ee;--c2:#6a4bd8;--glow:#c9a8ff}
.t-X{--c1:#e8e2f6;--c2:#7d7399;--glow:#fff}
.sub-Supporter{--c1:#ffdcb0;--c2:#c46a2a}
.sub-Item{--c1:#cdeeff;--c2:#3a78b8}

/* ---------- cards (20em x 28em, 1em = cw/20) ---------- */
.card{--cw:120px;font-size:calc(var(--cw)/20);width:var(--cw);height:calc(var(--cw)*1.4);position:relative;border-radius:1.2em;background:linear-gradient(160deg,var(--c1,#ddd),var(--c2,#888));border:.28em solid var(--ink);box-shadow:0 .3em 0 rgba(0,0,0,.35);overflow:hidden;color:var(--ink);text-align:left;flex:none;transform-style:preserve-3d;transition:transform .15s ease-out}
.card .c-in{position:absolute;inset:.45em;border-radius:.85em;background:linear-gradient(#fffdf5,#f6ecd0);display:flex;flex-direction:column;padding:.5em;gap:.4em;border:.15em solid rgba(26,16,48,.5)}
.card .c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.3em;min-height:2.5em}
.card .c-nm{min-width:0;display:flex;flex-direction:column}
.card .c-nm small{font-size:.8em;opacity:.65;line-height:1;white-space:nowrap}
.card .c-nm b{font-size:1.5em;line-height:1.08;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c-hp{font-size:1.3em;font-weight:900;display:flex;align-items:center;gap:.2em;white-space:nowrap;line-height:1}
.card .c-hp small{font-size:.55em;color:#b0392a}
.card .c-hp .en{width:1.3em;height:1.3em}
.card .c-art{position:relative;height:11.5em;flex:none;border-radius:.6em;overflow:hidden;border:.18em solid var(--ink);background:var(--c1)}
.card .c-art img{width:100%;height:100%;object-fit:cover}
.card .c-ex{position:absolute;right:.3em;bottom:.3em;font-style:normal;font-size:1em;background:var(--ink);color:var(--sun);border-radius:.6em;padding:.1em .5em}
.card .c-rows{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-around;gap:.2em}
.card .atk{display:flex;align-items:center;gap:.4em}
.card .a-cost{display:flex;min-width:3.1em;gap:.05em}
.card .a-cost .en{width:1.4em;height:1.4em;vertical-align:0}
.card .a-cost .free{font-size:.8em;opacity:.6}
.card .a-main{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.05}
.card .a-main b{font-size:1.3em;font-weight:900}
.card .a-main small{font-size:.85em;font-weight:700;opacity:.8;line-height:1.1}
.card .a-dmg{font-size:1.6em;font-weight:900;min-width:1.4em;text-align:right}
.card .ab{background:rgba(255,95,162,.14);border-radius:.4em;padding:.15em .3em;line-height:1.1}
.card .ab b{font-size:1em;color:#c0206a;display:block}
.card .ab small{font-size:.85em;font-weight:700}
.card .c-text{font-size:1.25em;line-height:1.25;padding:.3em .1em;font-weight:800}
.card .c-foot{display:flex;justify-content:space-between;align-items:center;font-size:.85em;opacity:.85;border-top:.12em dashed rgba(26,16,48,.35);padding-top:.2em;gap:.3em;white-space:nowrap}
.card .c-foot .en{width:1.2em;height:1.2em}
.card .c-no{font-weight:900}
.card .c-foil{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:color-dodge;border-radius:inherit}
.card.r-2{box-shadow:0 .3em 0 rgba(0,0,0,.35),inset 0 0 0 .2em rgba(255,255,255,.35)}
.card.r-3{border-color:#3b2a7a;box-shadow:0 .3em 0 rgba(0,0,0,.35),0 0 1.2em var(--glow,#fff)}
.card.r-4{border-color:#7a5200;box-shadow:0 .3em 0 rgba(0,0,0,.35),0 0 1.6em #ffd23d}
.card.r-3 .c-foil,.card.r-4 .c-foil{opacity:.5;background:linear-gradient(115deg,transparent 20%,rgba(255,120,200,.55) 38%,rgba(120,220,255,.55) 50%,rgba(255,240,120,.5) 62%,transparent 80%);background-size:250% 250%;background-position:var(--mx,30%) var(--my,30%);animation:foil 5s ease-in-out infinite}
@keyframes foil{50%{background-position:80% 70%}}
.card.big .c-foil{animation:none;opacity:.6}
.card.back{background:var(--night2)}
.card.back img{width:100%;height:100%;object-fit:cover}
.card.big{transition:transform .08s linear}

/* ---------- grid (album / deck) ---------- */
.grid{display:grid;grid-template-columns:repeat(var(--cols,3),var(--cw,100px));gap:10px;padding:4px 14px 10px;justify-content:center}
.tile{position:relative;display:block}
.tile .card{pointer-events:none}
.tile.miss .card{filter:grayscale(.7) brightness(.7);opacity:.6}
.tile .tno{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:calc(var(--cw)/5);color:#fff;text-shadow:0 2px 0 var(--ink);opacity:.8}
.tile .cnt{position:absolute;right:-3px;bottom:-3px;background:var(--ink);color:var(--sun);font-size:12px;padding:2px 7px;border-radius:10px;border:2px solid var(--sun)}
.newdot{position:absolute;left:-3px;top:-3px;background:var(--red);color:#fff;font-size:9px;padding:2px 5px;border-radius:8px;border:2px solid var(--ink);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.empty{grid-column:1/-1;color:#bdb2ea;text-align:center;padding:30px 10px}
.tile.dk{padding-bottom:0}
.tile.dk.in .card{outline:3px solid var(--sun);outline-offset:1px;border-radius:14px}
.dk-ctl{display:flex;align-items:center;justify-content:space-between;margin-top:4px;background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:2px}
.dk-ctl button{width:34px;height:30px;border-radius:10px;background:var(--sun);font-size:20px;font-weight:900;line-height:1;border:2px solid var(--ink)}
.dk-ctl button:disabled{background:#ddd5ee;color:#9a90b8;border-color:#9a90b8}
.dk-ctl b{font-size:15px}.dk-ctl i{font-style:normal;opacity:.5;font-size:11px}
.zoom{position:absolute;right:2px;top:2px;width:30px;height:30px;border-radius:15px;background:rgba(26,16,48,.75);color:#fff;font-size:17px;line-height:1}
.deckbar{flex-wrap:wrap}
.deckbar>div:first-child{min-width:110px;flex:1}
.deckbar .dsum{order:3;flex-basis:100%}
.deckbar .dbtns{margin-left:0}
.dsum{display:flex;align-items:center;gap:8px;font-size:13px;color:#e6defc;flex-wrap:wrap}
.dsum b{font-size:22px;color:var(--mint);white-space:nowrap}.dsum b.bad{color:#ff9a8a}.dsum b i{font-style:normal;font-size:13px;opacity:.7}
.dsum .tc{display:inline-flex;align-items:center;gap:2px}
.dbtns{display:flex;gap:8px;margin-left:auto}
.okmsg{color:var(--mint)!important}.badmsg{color:#ffb4a8!important}

/* ---------- starter ---------- */
#s-starter{align-items:center;justify-content:center;overflow-y:auto}
.st-wrap{position:relative;z-index:2;width:100%;max-width:880px;padding:12px 16px;display:flex;flex-direction:column;gap:12px;color:#fff;align-items:center;text-align:center}
.st-wrap h2{font-size:26px;text-shadow:0 3px 0 var(--ink)}
.sub{color:#d3c9f7;font-size:14px;line-height:1.35;max-width:520px}
.st-row{display:flex;flex-direction:column;gap:12px;width:100%}
.st-card{display:grid;grid-template-columns:96px 1fr;grid-template-rows:auto auto auto;column-gap:12px;align-items:center;text-align:left;padding:10px 12px;border-radius:20px;border:4px solid var(--ink);background:linear-gradient(150deg,var(--c1),var(--c2));box-shadow:0 5px 0 var(--ink);color:var(--ink)}
.st-card:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.st-art{grid-row:1/4;width:96px;height:96px;border-radius:16px;background:rgba(255,255,255,.35);overflow:hidden}
.st-art img{width:100%;height:100%;object-fit:contain}
.st-card b{font-size:22px}.st-card small{font-size:13px;line-height:1.25;font-weight:700}
.st-mini{display:flex;gap:4px;margin-top:4px}.st-mini img{width:38px;height:38px;border-radius:10px;border:2px solid var(--ink);object-fit:cover}
.land .st-row{flex-direction:row}
.land .st-card{display:flex;flex-direction:column;text-align:center;flex:1;align-items:center;gap:4px}
.land .st-art{width:84px;height:84px}
.land .st-wrap{gap:8px;padding:6px 16px}.land .st-wrap h2{font-size:22px}
.land .st-mini{display:none}

/* ---------- circuit ---------- */
.path{display:flex;flex-direction:column;gap:10px;padding:4px 14px 14px;position:relative;max-width:640px;margin:0 auto}
.path::before{content:"";position:absolute;left:46px;top:10px;bottom:10px;width:6px;border-radius:3px;background:repeating-linear-gradient(#ffffff40 0 10px,transparent 10px 18px)}
.tnode{position:relative;display:flex;align-items:center;gap:12px;padding:8px 12px 8px 8px;border-radius:20px;background:var(--cream);border:4px solid var(--ink);box-shadow:0 4px 0 var(--ink);text-align:left}
.tnode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tnode.beaten{background:#dff7e6}
.tnode.locked{filter:grayscale(.85) brightness(.85)}
.tnode.champ{background:linear-gradient(#fff2b8,#ffd23d);border-color:#5a3a00}
.tav{position:relative;width:62px;height:62px;border-radius:50%;overflow:hidden;border:3px solid var(--ink);flex:none;background:#fff}
.tav img{width:100%;height:100%;object-fit:cover}
.tav .lock,.tav .chk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;background:rgba(26,16,48,.55);font-size:24px;color:#fff}
.tav .chk{background:rgba(40,160,90,.55);font-size:30px}
.tinfo{flex:1;min-width:0;display:flex;flex-direction:column}
.tinfo b{font-size:18px}.tinfo small{font-size:12px;opacity:.7}
.lvl{color:#e8a200;font-size:13px;letter-spacing:1px}.lvl i{font-style:normal;color:#c9bfa8;opacity:.8}
.ttypes{display:flex;gap:2px;flex:none}
.ttypes .en{width:20px;height:20px}
.twins{position:absolute;right:10px;top:6px;font-size:11px;color:#2b8a46}

/* ---------- toast ---------- */
#toast{position:absolute;left:50%;top:calc(var(--sat) + 14px);transform:translate(-50%,-30px);opacity:0;z-index:90;background:var(--ink);color:#fff;border-radius:16px;padding:10px 16px;font-size:14px;max-width:86vw;text-align:center;pointer-events:none;transition:all .25s;border:2px solid var(--sun)}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- modals ---------- */
#modal-root{position:absolute;inset:0;z-index:50;pointer-events:none}
.modal{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;opacity:0;transition:opacity .2s;padding:var(--sat) var(--sar) 0 var(--sal)}
.modal.on{opacity:1}
.m-back{position:absolute;inset:0;background:rgba(10,6,30,.66);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.m-sheet{position:relative;width:100%;max-width:560px;max-height:calc(100% - 12px);overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--cream);border:4px solid var(--ink);border-bottom:0;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + var(--sab));transform:translateY(40px);transition:transform .22s cubic-bezier(.2,1.2,.4,1);box-shadow:0 -6px 0 rgba(0,0,0,.2)}
.modal.on .m-sheet{transform:none}
.land .modal{align-items:center}
.land .m-sheet{border-bottom:4px solid var(--ink);border-radius:26px;padding-bottom:18px;max-width:min(680px,calc(100% - 24px))}
.m-sheet h3{font-size:22px;margin-bottom:6px}
.m-sheet p{font-size:14px;line-height:1.4;font-weight:700;color:#4a3f6a;margin-bottom:8px}
.m-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:12px;align-items:center}
.m-btns.wrap{flex-wrap:wrap}
.m-btns .btn.big{flex:1}
.modal.small .m-sheet{max-width:420px}
.modal.small{align-items:center}.modal.small .m-sheet{border-bottom:4px solid var(--ink);border-radius:26px;max-width:min(420px,calc(100% - 28px));padding-bottom:18px}
.help ol{padding-left:20px;margin:6px 0;display:flex;flex-direction:column;gap:7px;font-size:14px;line-height:1.35;color:#3a2f5a}
/* trainer */
.tm-top{display:flex;gap:14px;align-items:center}
.tm-av{width:92px;height:92px;border-radius:50%;border:4px solid var(--ink);flex:none}
.tm-top h3{font-size:26px;margin:0}.tm-title{margin:0!important;opacity:.7}
.bubble{margin:12px 0 6px;padding:10px 14px;background:#fff;border:3px solid var(--ink);border-radius:16px;font-size:14px;font-style:italic;font-weight:700;position:relative}
.note{background:#fff0c4;padding:8px 10px;border-radius:12px;border:2px solid #e0b030}
.prizes h4{font-size:14px;margin:8px 0 6px}
.pz-row{display:flex;gap:6px;flex-wrap:wrap}
.pz{position:relative}.pz.have .card{opacity:.5}
.pz i{position:absolute;left:-2px;top:-4px;font-style:normal;font-size:8px;background:var(--red);color:#fff;border-radius:6px;padding:1px 4px;border:1.5px solid var(--ink)}
.pz.more{display:flex;align-items:center;justify-content:center;width:56px;height:78px;border-radius:10px;border:3px dashed #9a90b8;color:#7d7399}
/* viewer */
.modal.viewer-m .m-sheet{background:transparent;border:0;box-shadow:none;max-width:480px;display:flex;flex-direction:column;align-items:center;gap:10px;padding-top:0}
.land .modal.viewer-m .m-sheet{border:0}
.viewer{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.v-card{perspective:900px;touch-action:none}
.v-card .card{box-shadow:0 14px 30px rgba(0,0,0,.5)}
.v-info{background:var(--cream);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;width:100%;text-align:center}
.v-info b{font-size:18px}.fl{font-size:13px!important;font-style:italic;margin:4px 0!important}.own{font-size:12px!important;margin:0!important;opacity:.7}
.rar{display:inline-block;font-size:11px;padding:2px 8px;border-radius:10px;border:2px solid var(--ink);vertical-align:middle;background:#ddd}
.rar.r-1{background:#bfe9ff}.rar.r-2{background:#ffe08a}.rar.r-3{background:#e0b8ff}.rar.r-4{background:linear-gradient(90deg,#ffd23d,#ff8ad0)}
.evo{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:6px;color:var(--dim)}
.evo button{width:46px;height:46px;border-radius:12px;border:3px solid var(--ink);overflow:hidden;background:#fff}
.evo button.cur{outline:3px solid var(--sun)}.evo img{width:100%;height:100%;object-fit:cover}.evo i{font-style:normal;font-size:20px}
.v-nav{display:flex;gap:10px}.v-nav .btn{min-width:64px}
.land .viewer{flex-direction:row;flex-wrap:wrap;justify-content:center}
.land .modal.viewer-m .m-sheet{max-width:760px}
.land .v-info{width:240px}
.land .v-nav{width:100%;justify-content:center}
/* settings */
.set .row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:2px dashed rgba(26,16,48,.15);font-size:15px}
.set .row.col{flex-direction:column;align-items:stretch;gap:6px}
.set .row small{font-size:12px;opacity:.65;font-weight:700;line-height:1.3}
.set .row b{color:#c0206a}
.tog{width:56px;height:32px;border-radius:16px;background:#cfc6e6;border:3px solid var(--ink);position:relative;flex:none;transition:background .15s}
.tog i{position:absolute;left:2px;top:2px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:transform .15s}
.tog.on{background:var(--mint)}.tog.on i{transform:translateX(24px)}
.seg{display:flex;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff}
.seg button{flex:1;padding:8px 4px;font-size:13px;border-right:2px solid var(--ink)}
.seg button:last-child{border-right:0}.seg button.on{background:var(--sun)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;max-width:220px;height:28px;background:transparent}
.row.col input[type=range]{max-width:none}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:#cfc6e6;border:2px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);margin-top:-10px}
.tiny{font-size:11px!important;opacity:.6;margin-top:10px!important}

/* ---------- reward ---------- */
#s-reward{align-items:center;justify-content:center;overflow-y:auto}
.rw-wrap{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 16px;text-align:center;color:#fff;width:100%;max-width:560px}
.rw-av{width:84px;height:84px;border-radius:50%;border:4px solid var(--ink);background:#fff}
.rw-wrap h2{font-size:34px;color:var(--sun);text-shadow:0 4px 0 var(--ink)}
.rw-line{font-size:14px;color:#e6defc;font-style:italic}
.rw-h{font-size:17px;margin:4px 0}
.flip{width:150px;height:210px;position:relative;perspective:900px;margin:6px auto}
.flip .fa,.flip .fb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.flip .fb{transform:rotateY(180deg)}
.flip.on .fa{transform:rotateY(180deg)}.flip.on .fb{transform:none}
.rw-three,.rw-got{display:flex;gap:10px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.rw-opt{position:relative;padding:5px;border-radius:14px;border:3px solid transparent;animation:rise .4s both}
.rw-opt.sel{border-color:var(--sun);background:rgba(255,210,61,.2);transform:translateY(-6px)}
.rw-opt i{position:absolute;left:0;top:0;font-style:normal;font-size:10px;background:var(--red);color:#fff;border-radius:8px;padding:2px 6px;border:2px solid var(--ink);z-index:3}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.9)}}
.rw-sub{color:#d3c9f7;font-size:13px}
.rw-wrap .m-btns{justify-content:center}
.land .rw-wrap{padding:6px 16px;gap:4px}.land .rw-av{display:none}.land .rw-wrap h2{font-size:26px}
.land .flip{width:120px;height:168px}

/* ---------- battle ---------- */
#s-battle{padding:0}
.vs{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:4vw;padding:var(--sat) var(--sar) var(--sab) var(--sal);flex-wrap:wrap;align-content:center;background:radial-gradient(circle at 50% 50%,#4a2fb8,#1b1250);animation:vsin .4s ease-out}
.vs.out{animation:vsout .26s ease-in forwards}
@keyframes vsin{from{opacity:0;transform:scale(1.1)}}
@keyframes vsout{to{opacity:0;transform:scale(.96)}}
.vs-l,.vs-r{display:flex;flex-direction:column;align-items:center;gap:4px;color:#fff;animation:rise .5s .1s both}
.vs-l img,.vs-r img{width:min(34vw,34vh,150px);height:min(34vw,34vh,150px);border-radius:50%;border:5px solid var(--ink);background:#fff;box-shadow:0 6px 0 var(--ink)}
.vs-l b,.vs-r b{font-size:22px;text-shadow:0 3px 0 var(--ink)}.vs-r small{opacity:.75}.vs .lvl{font-size:16px}
.vs-mid{font-size:min(16vw,70px);color:var(--sun);text-shadow:0 5px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink);transform:rotate(-8deg);animation:pop .6s .3s both}
@keyframes pop{from{transform:scale(0) rotate(-30deg)}}
.vs-q{flex-basis:100%;text-align:center;color:#e6defc;font-style:italic;padding:0 24px;font-size:14px;max-width:560px}

.bt{position:absolute;inset:0;padding:var(--sat) var(--sar) var(--sab) var(--sal);display:grid;gap:4px;justify-content:center;
  --aw:100px;--bw:66px;--hw:60px;
  grid-template-columns:minmax(0,1fr);
  grid-template-rows:30px auto auto 44px auto auto 30px auto auto;
  grid-template-areas:"bar-opp" "ob" "oa" "mid" "ma" "mb" "bar-me" "hand" "acts";
  background:radial-gradient(90% 60% at 50% 38%,#4b34c4 0%,transparent 70%),linear-gradient(#25166b,#140c3e)}
.bt::before{content:"";position:absolute;left:0;right:0;top:50%;height:4px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.18) 0 14px,transparent 14px 26px);transform:translateY(-14px);pointer-events:none}
#bar-opp{grid-area:bar-opp}#ob{grid-area:ob}#oa{grid-area:oa}#mid{grid-area:mid}#ma{grid-area:ma}#mb{grid-area:mb}#bar-me{grid-area:bar-me}#hand{grid-area:hand}#acts{grid-area:acts}
.bt-bar{white-space:nowrap;display:flex;align-items:center;gap:10px;padding:0 12px;color:#fff;font-size:14px;min-width:0}
.bt-bar b{font-size:15px}.bt-bar b.turn{color:var(--sun)}.bt-bar b.turn::after{content:" ●";font-size:10px;animation:pulse 1s infinite;display:inline-block}
.mini-av{width:26px;height:26px;border-radius:50%;border:2px solid var(--ink);background:#fff}
.pips.pt{display:flex;gap:4px}.pips.pt i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:#0e0a2e;display:block}
.pips.pt i.on{background:var(--sun);box-shadow:0 0 8px var(--sun)}
.cnt{display:inline-flex;align-items:center;gap:3px;font-size:13px;color:#cbbff5}.cnt svg{width:15px;height:15px}
.bt-bar.me{justify-content:flex-start}
.bt-bar .pause{margin-left:auto;width:34px;height:30px;color:#fff;background:rgba(255,255,255,.14);border-radius:10px}.pause svg{width:18px;height:18px}
.bt-bench{display:flex;gap:8px;justify-content:center;align-items:center}
.bt-act{display:flex;justify-content:center;align-items:center}

.slot{--sw:var(--aw);position:relative;width:var(--sw);height:var(--sh,calc(var(--sw)*1.4));font-size:calc(var(--sw)/10);border-radius:calc(var(--sw)/8);border:calc(var(--sw)/30) solid var(--ink);background:linear-gradient(160deg,var(--c1),var(--c2));overflow:hidden;color:var(--ink);text-align:left;box-shadow:0 .35em 0 rgba(0,0,0,.35);flex:none;transition:transform .15s,box-shadow .15s}
.slot.bn{--sw:var(--bw);font-size:calc(var(--sw)/8)}
.bt.land .slot.bn{--sw:var(--bwl);--sh:var(--bh);font-size:calc(var(--bh)/6.6)}
.slot.empty{background:rgba(255,255,255,.07);border:3px dashed rgba(255,255,255,.25);box-shadow:none;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.35);font-size:calc(var(--sw)/3)}
.slot.empty.act{font-size:1em}
.s-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.s-top{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:.3em .5em;background:linear-gradient(rgba(255,255,255,.88),rgba(255,255,255,.55));gap:.2em}
.s-top b{font-size:1.15em;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-top .en{width:1.5em;height:1.5em}
.slot.bn .s-top b{font-size:1.25em}
.s-st{position:absolute;left:.3em;top:2.1em;display:flex;flex-direction:column;gap:.2em;align-items:flex-start;font-size:1.1em}
.s-ex{position:absolute;right:.3em;top:2.2em;font-size:.9em;background:var(--ink);color:var(--sun);border-radius:.6em;padding:.05em .4em}
.s-stg{position:absolute;right:.4em;top:3.7em;font-size:.8em;color:var(--ink);background:rgba(255,255,255,.75);border-radius:.4em;padding:0 .35em;font-style:normal;letter-spacing:.05em}
.slot.bn .s-ex,.slot.bn .s-stg{display:none}
.s-en{position:absolute;left:.3em;right:.3em;bottom:2.1em;display:flex;flex-wrap:wrap;gap:.2em;align-items:center}
.s-en em{font-style:normal;font-size:1em;color:#fff;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink)}
.pip{display:block;width:1.35em;height:1.35em;border-radius:50%;border:.14em solid var(--ink);background:#ccc;box-shadow:inset -.2em -.2em 0 rgba(0,0,0,.15)}
.p-F{background:#ff7a45}.p-T{background:#3fa7ff}.p-L{background:#5fd16f}.p-V{background:#ffd84a}.p-I{background:#8fe3ff}.p-S{background:#c9a46a}.p-D{background:#9d78ff}.p-C{background:#ffb6e6}.p-N{background:#e6e6e6}
.s-hp{position:absolute;left:.3em;right:.3em;bottom:.3em;height:1.65em;border-radius:.9em;background:#0e0a2e;border:.16em solid var(--ink);overflow:hidden}
.s-hp i{position:absolute;left:0;top:0;bottom:0;background:var(--mint);transition:width .5s}
.s-hp i.mid{background:var(--sun)}.s-hp i.lo{background:var(--red)}
.s-hp em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:1em;color:#fff;text-shadow:0 1px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink),0 -1px 0 var(--ink)}
.slot.tgt{outline:4px solid var(--sun);outline-offset:2px;animation:tgt .8s ease-in-out infinite;z-index:3}
.slot.empty.tgt{background:rgba(255,210,61,.18)}
@keyframes tgt{50%{outline-color:#fff;transform:scale(1.04)}}
.slot.pop{animation:slotpop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes slotpop{from{transform:scale(.6);opacity:.2}}
.slot.hit{animation:hit .42s}
@keyframes hit{0%,100%{transform:none;filter:none}15%{transform:translateX(-8px);filter:brightness(2) saturate(.2)}35%{transform:translateX(8px);filter:brightness(1.5) sepia(1) hue-rotate(-50deg) saturate(4)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.slot.ko{animation:ko .9s forwards}
@keyframes ko{40%{transform:rotate(-8deg) scale(1.05);filter:brightness(1.8)}100%{transform:translateY(40px) rotate(14deg) scale(.4);opacity:0}}
.slot.evo{animation:evo .9s}
@keyframes evo{0%,100%{filter:none;transform:none}30%{filter:brightness(3);transform:scale(1.15)}60%{filter:brightness(1.6) hue-rotate(40deg)}}
.slot.lunge-up{animation:lungeU .5s}.slot.lunge-down{animation:lungeD .5s}
@keyframes lungeU{50%{transform:translateY(-34px) scale(1.1)}}
@keyframes lungeD{50%{transform:translateY(34px) scale(1.1)}}
.slot.zz::after{content:"Zz";position:absolute;right:.4em;top:50%;font-size:1.8em;color:#fff;text-shadow:0 2px 0 var(--ink);animation:bob 1.6s infinite}

.bt-mid,#mid{display:flex;align-items:center;gap:10px;padding:0 12px;min-width:0}
.mid-t{flex:none;font-size:13px;color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:3px 10px;box-shadow:0 3px 0 var(--ink)}
.mid-log{flex:1;min-width:0;text-align:left;color:#e6defc;font-size:12px;line-height:1.2;max-height:2.5em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.orb{position:relative;flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#d8d0ee;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.orb .en{width:30px;height:30px}.orb small{position:absolute;bottom:-9px;font-size:9px;background:var(--ink);color:#fff;padding:0 5px;border-radius:6px}
.orb.ready{animation:orb 1s ease-in-out infinite;background:#fff}
.orb.on{outline:4px solid var(--sun)}
@keyframes orb{50%{transform:scale(1.14);box-shadow:0 0 18px var(--sun),0 3px 0 var(--ink)}}

.bt-hand{display:flex;gap:5px;align-items:flex-end;justify-content:safe center;overflow-x:auto;overflow-y:hidden;padding:6px 8px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.bt-hand::-webkit-scrollbar{display:none}
.hc{flex:none;position:relative;transition:transform .15s;opacity:.55;filter:saturate(.7)}
.hc.ok{opacity:1;filter:none}
.hc.sel{transform:translateY(-12px) scale(1.08);z-index:3;opacity:1;filter:none}
.hc.sel .card{outline:3px solid var(--sun);border-radius:10px}
.hc .card{pointer-events:none}
.hand-empty{color:#a99bdc;font-size:13px;align-self:center}
.bt-acts{display:flex;gap:8px;justify-content:center;padding:4px 10px 6px}
.bt-acts .btn{flex:1;min-width:0;max-width:150px;padding:0 8px;min-height:44px;font-size:15px}
.bt-fx{position:absolute;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.fnum{position:absolute;transform:translate(-50%,-50%);font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:0;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);animation:fnum 1.2s ease-out forwards;white-space:nowrap}
.fnum.big{font-size:46px;color:#ffe066}.fnum.weak{color:#ff8a5c;font-size:40px}.fnum.heal{color:var(--mint)}.fnum.dot{color:#d9a0ff;font-size:28px}
.fnum.tag{font-size:19px;color:var(--sun)}.fnum.ko{font-size:44px;color:#ff5a4d}
@keyframes fnum{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}15%{transform:translate(-50%,-70%) scale(1.25);opacity:1}30%{transform:translate(-50%,-60%) scale(1)}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
.banner{position:absolute;left:0;right:0;top:44%;transform:translateY(-50%);display:flex;justify-content:center;animation:banner 1.1s ease-out forwards}
.banner span{font-size:30px;padding:8px 28px;border:4px solid var(--ink);border-radius:18px;background:var(--sun);color:var(--ink);box-shadow:0 6px 0 var(--ink);transform:rotate(-2deg);white-space:nowrap;font-weight:900}
.banner.me span{background:var(--mint)}.banner.opp span{background:var(--pink);color:#fff}.banner.win span{font-size:52px;background:var(--sun)}.banner.lose span{background:#8a7fb0;color:#fff}
@keyframes banner{0%{opacity:0;transform:translateY(-50%) translateX(-60px)}18%{opacity:1;transform:translateY(-50%)}82%{opacity:1}100%{opacity:0;transform:translateY(-50%) translateX(60px)}}
.coin{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.coin b{font-size:26px;color:#fff;text-shadow:0 3px 0 var(--ink);opacity:0;transition:opacity .2s}.coin.done b{opacity:1}
.cn{width:84px;height:84px;position:relative;transform-style:preserve-3d;animation:flipc .75s ease-out forwards}
.cn i{position:absolute;inset:0;border-radius:50%;border:5px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:40px}
.cn .f1{background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc400);}.cn .f1::after{content:"★";color:#b87400}
.cn .f2{background:radial-gradient(circle at 35% 30%,#e8e8f4,#9a9ab8);transform:rotateY(180deg)}.cn .f2::after{content:"●";color:#6a6a8a}
.cn.t{--end:900deg}.cn.h{--end:720deg}
@keyframes flipc{from{transform:translateY(60px) rotateY(0) scale(.7)}50%{transform:translateY(-40px) rotateY(360deg) scale(1.15)}to{transform:translateY(0) rotateY(var(--end)) scale(1)}}
.ctoast{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px;animation:ct 1.5s ease-out forwards}
.ctoast span{background:var(--ink);color:#fff;padding:2px 10px;border-radius:10px;font-size:12px}
@keyframes ct{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}

/* setup modal */
.su h3{margin:0 0 4px}.su-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.su-c{position:relative;border-radius:14px;padding:2px}.su-c.off{opacity:.35;filter:grayscale(.6)}
.su-c.active .card{outline:4px solid var(--sun);border-radius:14px}.su-c.bench .card{outline:4px solid var(--sky);border-radius:14px}
.su-c .card{pointer-events:none}
.role{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);font-style:normal;font-size:10px;background:var(--ink);color:#fff;padding:2px 8px;border-radius:8px;border:2px solid #fff}
.su-c.active .role{background:#c98a00}.su-c.bench .role{background:#1d6fb8}
/* inspect panel */
.panel .m-sheet{max-width:640px}
.cp{display:flex;gap:14px;align-items:flex-start}
.cp-card{flex:none}.cp-side{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.cp-side h3{display:flex;flex-direction:column;margin:0}.cp-side h3 small{font-size:13px;opacity:.6}
.cp-en{display:flex;flex-wrap:wrap;gap:3px;font-size:18px}.dim{opacity:.5;font-size:13px}
.cp-ab{font-size:12px!important;background:#ffe3f0;border-radius:10px;padding:6px 8px;margin:0!important}
.cp-atks{display:flex;flex-direction:column;gap:6px}
.atk-btn{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:14px;border:3px solid var(--ink);background:#e7e1f5;text-align:left;color:#7d7399}
.atk-btn.can{background:var(--sun);color:var(--ink);box-shadow:0 3px 0 var(--ink)}
.atk-btn.can:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.ab-c{display:flex;gap:1px;min-width:48px;font-size:14px}.ab-m{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.1}.ab-m b{font-size:15px}.ab-m small{font-size:11px;font-weight:700;opacity:.75}
.ab-d{font-size:22px;font-weight:900;text-align:right;min-width:36px}.ab-d em{display:block;font-style:normal;font-size:9px;color:#d03a1a}
.logm ol{margin:6px 0;padding-left:18px;font-size:13px;line-height:1.4;max-height:50vh;overflow:auto;color:#3a2f5a}
.res{text-align:center}.res .rw-av{margin:0 auto 6px;display:block}

/* ---------- battle: landscape ---------- */
.bt.land{
  grid-template-columns:auto auto minmax(150px,1fr) auto auto;
  grid-template-rows:28px minmax(0,1fr) auto;
  grid-template-areas:"bar-opp bar-opp mid bar-me bar-me" "ob oa mid ma mb" "hand hand hand acts acts";
  column-gap:8px;row-gap:4px}
.bt.land::before{left:50%;right:auto;top:0;bottom:0;width:4px;height:auto;transform:none;background:repeating-linear-gradient(rgba(255,255,255,.18) 0 14px,transparent 14px 26px)}
.bt.land .bt-bench{flex-direction:column;gap:6px}
.bt.land #mid{flex-direction:column;justify-content:center;align-items:center;gap:10px;padding:0}
.bt.land .mid-log{flex:none;text-align:center;width:100%;max-height:none;-webkit-line-clamp:4}
.bt.land .orb{order:3}
.bt.land #acts{flex-direction:row;align-items:flex-end;justify-content:flex-end;padding:4px 0 6px;gap:6px}
.bt.land #acts .btn{max-width:none;flex:1;min-height:42px;font-size:13px;padding:0 6px}
.bt.land .bt-hand{padding-top:10px}
.bt.land #bar-opp,.bt.land #bar-me{padding:0 6px}
.land .cp-card .card{--cw:150px}
.land .modal.panel .cp{align-items:center}
@media (max-height:360px){.bt.land .pips.pt i{width:12px;height:12px}}
#rotate-hint{display:none}

.slot.bn .s-top .en{display:none}
.slot.bn .s-top b{font-size:1.1em}

/* ---------- tutorial ---------- */
.coach{position:absolute;z-index:70;display:flex;gap:10px;align-items:flex-start;padding:10px 12px 12px;background:var(--cream);border:4px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink),0 10px 26px rgba(0,0,0,.45);animation:coachin .3s cubic-bezier(.2,1.4,.4,1);transition:left .2s,top .2s}
.coach[hidden]{display:none}
@keyframes coachin{from{opacity:0;transform:translateY(-10px) scale(.94)}}
.co-av{width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff;flex:none}
.co-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.co-body b{font-size:12px;color:#c0206a;letter-spacing:.4px;text-transform:uppercase}
.co-body p{font-size:14px;line-height:1.3;color:var(--ink);margin:0}
.co-body .btn{align-self:flex-end;margin-top:2px}
.co-bar{display:block;height:5px;border-radius:3px;background:rgba(26,16,48,.15);overflow:hidden;margin-top:2px}
.co-bar u{display:block;height:100%;background:var(--mint);text-decoration:none;transition:width .4s}
.land .co-body p{font-size:13px}
.tut-hl{animation:tuthl 1s ease-in-out infinite;box-shadow:0 0 0 4px #fff,0 0 0 8px var(--sun),0 0 26px 10px rgba(255,210,61,.85)!important;z-index:5;position:relative}
.slot.tut-hl{overflow:hidden}
@keyframes tuthl{50%{box-shadow:0 0 0 4px #fff,0 0 0 8px var(--pink),0 0 34px 14px rgba(255,95,162,.8)!important}}
.hc.tut-hl{border-radius:10px}
.su-coach{display:flex;gap:10px;align-items:flex-start;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:8px 10px;margin-bottom:4px}
.su-coach b{font-size:12px;color:#c0206a;text-transform:uppercase;letter-spacing:.4px}
.su-coach p{font-size:14px;margin:2px 0 0;color:var(--ink)}
.su-c.tut-hl{border-radius:14px}
.newtag{font-style:normal;font-size:10px;background:var(--red);color:#fff;border-radius:8px;padding:2px 6px;border:2px solid var(--ink);margin-left:2px}
.lessonbar{display:flex;align-items:center;gap:8px;margin:0 14px 8px;padding:10px 12px;border-radius:14px;background:linear-gradient(#fff1b0,var(--sun));border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);text-align:left;font-size:13px;color:var(--ink)}
.lessonbar b{font-weight:900}
.lessonbar span{margin-left:auto;background:var(--ink);color:#fff;border-radius:10px;padding:4px 10px;font-size:12px}

/* ---- version + updates ---- */
.t-build{margin:2px 0 0;color:#8f82c9;font-size:11px;font-weight:700;letter-spacing:.04em;cursor:pointer;padding:6px 10px;-webkit-tap-highlight-color:transparent}
.t-build.avail{color:#ffd24a;font-weight:900}
.set .row.ver small.upd-detail{display:block;margin-top:2px}
#upd-ov{position:absolute;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;background:rgba(20,10,60,.86);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.upd-box{display:flex;flex-direction:column;align-items:center;gap:8px;padding:24px 28px;border-radius:20px;background:#fff7e0;color:#1a1030;text-align:center;box-shadow:0 6px 0 var(--ink);border:3px solid var(--ink)}
.upd-box b{font-size:18px}.upd-box span{font-size:13px;opacity:.7;font-weight:700}
.upd-spin{width:34px;height:34px;border-radius:50%;border:5px solid rgba(26,16,48,.15);border-top-color:#e8346e;animation:updspin .8s linear infinite}
@keyframes updspin{to{transform:rotate(360deg)}}

/* landscape title: logo and info on the left, buttons on the right, so everything fits a short screen */
.land .t-main{display:grid;grid-template-columns:auto auto;grid-template-areas:"logo btns" "tag btns" "ver btns" "bld btns";align-content:center;align-items:center;justify-items:center;column-gap:clamp(24px,6vw,64px);row-gap:6px;padding:0 24px}
.land .t-main .logo{grid-area:logo;font-size:min(19vh,78px);margin-bottom:6px}
.land .t-main .tag{grid-area:tag;font-size:14px}
.land .t-main .t-btns{grid-area:btns;min-width:230px;gap:9px}
.land .t-main .t-ver{grid-area:ver;margin:0;font-size:11px}
.land .t-main .t-build{grid-area:bld;margin:0;padding:2px 10px}
.land .tc{width:min(15vw,96px)}
.land .tc0{left:2%;bottom:8%}.land .tc1{right:2%;bottom:8%}.land .tc2{right:3%;top:6%;width:min(13vw,80px)}.land .tc3{left:3%;top:6%;width:min(13vw,80px)}

/* ---------- attack cinematics (src/fx.js) ---------- */
.fxs{position:absolute;inset:0;z-index:40;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.fxs-dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#1a0f4a 0%,#080420 100%);opacity:0}
.fxs-in{position:absolute;inset:0;will-change:transform}
.fxs-bg,.fxs-fg{position:absolute;left:0;top:0;pointer-events:none}
.fxs-card{position:absolute;transform-origin:50% 50%;will-change:transform,opacity;opacity:0}
.fxs-cardbox{position:absolute;inset:0;filter:drop-shadow(0 8px 12px rgba(0,0,0,.55))}
.fxs-cardbox .card{position:absolute;left:0;top:0}
.fxs-portal{position:absolute;left:6.9%;top:15.3%;width:86.2%;height:41%;border-radius:.9em;mix-blend-mode:screen;opacity:0;pointer-events:none;box-shadow:inset 0 0 18px 6px rgba(255,255,255,.65)}
.fxs-crit{position:absolute;pointer-events:none;transform-origin:50% 80%;opacity:0;will-change:transform,filter}
.fxs-hp{position:absolute;left:-4%;right:-4%;top:100%;margin-top:6px;display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;font-size:12px;font-weight:900;color:#fff;text-shadow:0 2px 0 var(--ink),1px 0 0 var(--ink),-1px 0 0 var(--ink)}
.fxs-hp b{font-weight:900;font-size:12px;letter-spacing:.2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fxs-hp .bar{display:block;width:86%;height:9px;background:rgba(10,5,30,.8);border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.fxs-hp .bar i{display:block;height:100%;width:100%;background:var(--mint);transition:none}
.fxs-hp .bar i.mid{background:#ffd23d}.fxs-hp .bar i.lo{background:var(--red)}
.fxs-hp em{font-style:normal;font-size:11px}
.fxs-name{position:absolute;left:0;right:0;top:41%;display:flex;justify-content:center;pointer-events:none;opacity:0}
.fxs-name span{display:inline-block;font-size:clamp(24px,8vw,40px);font-weight:900;font-style:italic;letter-spacing:.5px;color:var(--nc,#fff);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink),0 0 18px var(--nc2,#fff);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis;padding:0 .1em}
.fxs-flash,.fxs-tint{position:absolute;inset:0;opacity:0;pointer-events:none}
.fxs-num{position:absolute;transform:translate(-50%,-50%);font-size:38px;font-weight:900;color:#fff;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink),2px 2px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);animation:fnum 1.3s ease-out forwards;white-space:nowrap;pointer-events:none}
.fxs-num.big{font-size:52px;color:#ffe066}.fxs-num.weak{color:#ff8a5c;font-size:46px}.fxs-num.heal{color:var(--mint)}.fxs-num.dot{color:#d9a0ff;font-size:28px}
.fxs-num.tag{font-size:19px;color:var(--sun)}
.fxs-word{position:absolute;transform:translate(-50%,-50%) rotate(var(--rot,0deg));font-size:clamp(28px,9vw,46px);font-weight:900;font-style:italic;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink),0 0 14px var(--wc,#fff);animation:fxword 1s ease-out forwards;white-space:nowrap;pointer-events:none}
@keyframes fxword{0%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(.2);opacity:0}16%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1.35);opacity:1}30%{transform:translate(-50%,-50%) rotate(var(--rot,0deg)) scale(1)}78%{opacity:1}100%{transform:translate(-50%,-70%) rotate(var(--rot,0deg)) scale(1.05);opacity:0}}
@media (prefers-reduced-motion:reduce){.fxs-word,.fxs-num{animation-duration:.6s}}

</style>

<script>
/* ===== version ===== */
(globalThis.CD = globalThis.CD || {}).VERSION = '1.4.0'; globalThis.CD.BUILD = '8c0de15';
/* ===== data.js ===== */
/* Critter Duel — card data, trainers, utilities. Original creatures & names. */
(function (root) {
  'use strict';
  const CD = (root.CD = root.CD || {});

  /* ---------- utilities ---------- */
  function hashStr(s) {
    let h = 2166136261 >>> 0;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
    return h >>> 0;
  }
  function mulberry(seed) {
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6d2b79f5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const U = { hashStr, mulberry };

  /* ---------- types ---------- */
  const TYPES = {
    F: { name: 'Flame',  c1: '#ffb07a', c2: '#c4361c', glow: '#ff7a45' },
    T: { name: 'Tide',   c1: '#8fd0ff', c2: '#1d5fb8', glow: '#3fa7ff' },
    L: { name: 'Leaf',   c1: '#a8ecaa', c2: '#2b8a46', glow: '#5fd16f' },
    V: { name: 'Volt',   c1: '#ffe98a', c2: '#c48a12', glow: '#ffd84a' },
    I: { name: 'Frost',  c1: '#d4f6ff', c2: '#4aa3d6', glow: '#8fe3ff' },
    S: { name: 'Stone',  c1: '#e0c79a', c2: '#7a5a32', glow: '#c9a46a' },
    D: { name: 'Shade',  c1: '#c1a6ff', c2: '#46288a', glow: '#9d78ff' },
    C: { name: 'Cosmic', c1: '#ffd0ee', c2: '#6a4bd8', glow: '#c9a8ff' },
    N: { name: 'Any',    c1: '#f1f1f1', c2: '#8a8a8a', glow: '#ffffff' }
  };
  const WEAK = { F: 'T', T: 'V', L: 'F', V: 'S', I: 'F', S: 'L', D: 'I', C: null };
  const RARITY = ['Common', 'Uncommon', 'Rare', 'Epic', 'Legendary'];
  const RSYM = ['●', '◆', '★', '★★', '✦'];

  /* ---------- card helpers ---------- */
  const CARDS = [];
  const BY = {};
  function add(c) { c.no = CARDS.length + 1; CARDS.push(c); BY[c.id] = c; return c; }
  function A(n, cost, d, fx) { return { n, c: cost === '' ? [] : cost.split(''), d, fx: fx || null }; }
  function cr(id, n, t, hp, st, from, r, ret, atk, o) {
    return add(Object.assign({ id, n, k: 'c', t, hp, st, from: from || null, r, ret, atk, pts: 1, ab: null }, o || {}));
  }
  function tr(id, n, sub, r, text, fx, o) {
    return add(Object.assign({ id, n, k: 't', sub, r, text, fx }, o || {}));
  }
  const AB = {
    swift:  (n) => ({ n, k: 'swift',  v: 0,  txt: 'This critter has no Retreat cost.' }),
    reduce: (n, v) => ({ n, k: 'reduce', v, txt: `Attacks against this critter do ${v} less damage.` }),
    regen:  (n, v) => ({ n, k: 'regen',  v, txt: `At the start of your turn, heal ${v} damage from this critter.` }),
    thorns: (n, v) => ({ n, k: 'thorns', v, txt: `When this Active critter is hit, the attacker takes ${v} damage.` })
  };

  /* ---------- FLAME ---------- */
  cr('embrit', 'Embrit', 'F', 50, 0, null, 0, 1,
    [A('Cinder Nip', 'F', 10), A('Smolder', 'FN', 20, { k: 'burn', flip: 1 })],
    { look: { a: 'chub', ears: 'point', crest: 'flame', tail: 'flame', hue: 0 }, fl: 'Its tail flame brightens when it is happy.' });
  cr('cindrake', 'Cindrake', 'F', 90, 1, 'embrit', 1, 2,
    [A('Scorch Claw', 'FN', 30), A('Fire Spin', 'FFN', 70, { k: 'discard', n: 1 })],
    { look: { a: 'dino', horns: 2, crest: 'flame', tail: 'plain', spikes: 5, eye: 'fierce', hue: -16 }, fl: 'It melts boulders just to clear a nap spot.' });
  cr('pyrodrax', 'Pyrodrax', 'F', 160, 2, 'cindrake', 2, 3,
    [A('Inferno Breath', 'FFN', 70, { k: 'burn' }), A('Dragon Blaze', 'FFFN', 140, { k: 'discard', n: 2 })],
    { look: { a: 'dino', horns: 3, crest: 'flame', tail: 'plain', spikes: 7, wings: 1, eye: 'fierce', aura: 1, hue: -16 }, fl: 'Volcanoes erupt when it roars at dawn.' });
  cr('sparkpup', 'Sparkpup', 'F', 60, 0, null, 0, 1,
    [A('Pounce', 'N', 10), A('Cinder Fang', 'FN', 30)],
    { look: { a: 'quad', ears: 'point', tail: 'flame', hue: 22 }, fl: 'Leaves tiny scorch marks wherever it plays.' });
  cr('blazehound', 'Blazehound', 'F', 110, 1, 'sparkpup', 1, 2,
    [A('Flame Fang', 'FN', 40), A('Hellhound Rush', 'FFN', 80, { k: 'recoil', n: 20 })],
    { look: { a: 'quad', ears: 'point', tail: 'flame', ex: ['mane'], eye: 'fierce', sz: 1.12, hue: 22 }, fl: 'Its mane of fire can be seen across the valley.' });
  cr('ashmoth', 'Ashmoth', 'F', 50, 0, null, 1, 1,
    [A('Ash Dust', 'F', 10, { k: 'sleep', flip: 1 }), A('Wingburn', 'FN', 30, { k: 'burn' })],
    { look: { a: 'bug', wings: 1, ex: ['ember'], hue: 38 }, ab: AB.swift('Light Flutter'), fl: 'It drifts on the heat of campfires.' });
  cr('magmarok', 'Magmarok', 'F', 140, 0, null, 3, 3,
    [A('Magma Fist', 'FN', 50), A('Eruption', 'FFN', 80, { k: 'spread', n: 20 })],
    { look: { a: 'golem', horns: 2, crest: 'flame', ex: ['lava'], eye: 'fierce', aura: 1, sz: 1.1, hue: -6 }, pts: 2, fl: 'Born when a volcano blinked.' });

  /* ---------- TIDE ---------- */
  cr('dripling', 'Dripling', 'T', 50, 0, null, 0, 1,
    [A('Splash', 'T', 10), A('Water Gun', 'TN', 30)],
    { look: { a: 'fish', tail: 'fin', hue: 0 }, fl: 'It leaves a trail of puddles on land.' });
  cr('brinefin', 'Brinefin', 'T', 90, 1, 'dripling', 1, 1,
    [A('Tidal Slap', 'TN', 30), A('Whirlpool', 'TTN', 60, { k: 'gust' })],
    { look: { a: 'fish', tail: 'fin', crest: 'fin', eye: 'fierce', hue: 0, sz: 1.1 }, fl: 'It spins so fast the sea forgets which way is up.' });
  cr('leviathorn', 'Leviathorn', 'T', 170, 2, 'brinefin', 2, 3,
    [A('Riptide', 'TTN', 60, { k: 'spread', n: 10 }), A('Hydro Crush', 'TTTN', 130, { k: 'discard', n: 2 })],
    { look: { a: 'fish', tail: 'fin', crest: 'fin', horns: 2, eye: 'fierce', aura: 1, sz: 1.25, hue: 0 }, ab: AB.reduce('Slick Scales', 10), fl: 'Ships still hum its warning song.' });
  cr('bubbun', 'Bubbun', 'T', 50, 0, null, 0, 1,
    [A('Bubble Pop', 'T', 10, { k: 'heal', n: 10 }), A('Aqua Tail', 'TN', 30)],
    { look: { a: 'chub', ears: 'round', tail: 'fin', ex: ['bubbles'], hue: 14 }, fl: 'It blows bubbles to carry its snacks.' });
  cr('torrentail', 'Torrentail', 'T', 100, 1, 'bubbun', 1, 2,

    switch (fx.k) {

      case 'sleep': return f + (fx.flip ? 'the' : 'The') + ' Defending critter is now Asleep.';

      case 'recoil': return `This critter also takes ${fx.n} damage.`;
      case 'draw': return `Draw ${fx.n} card${fx.n > 1 ? 's' : ''}.`;
      case 'discard': return `Discard ${fx.n} energy from this critter.`;
      case 'flipx': return `Flip ${fx.n} coins. This attack does ${d} damage for each heads.`;
      case 'snipe': return `Also does ${fx.n} damage to 1 of your opponent's Benched critters.`;
      case 'spread': return `Also does ${fx.n} damage to each of your opponent's Benched critters.`;
      case 'charge': return 'Attach 1 energy to 1 of your Benched critters.';
      case 'shield': return `During your opponent's next turn, this critter takes ${fx.n} less damage.`;
      case 'gust': return 'Switch your opponent\'s Active critter with 1 of their Benched critters.';
      case 'flip0': return 'Flip a coin. If tails, this attack does nothing.';
      default: return '';

    el._m = m; modals.push(m);

    UI.insets = ins; UI.W = W; UI.H = H;
    $$('.grid[data-fit]').forEach(fitGrid);
    if (CD.Battle && CD.Battle.layout) CD.Battle.layout();

  function fitGrid(g) {
    const pad = parseFloat(g.dataset.pad || 14), gap = parseFloat(g.dataset.gap || 10);

    const min = parseFloat(g.dataset.min || 104);
    const cols = Math.max(3, Math.min(9, Math.floor((w + gap) / (min + gap))));

    const pop = B.pops.includes(p + ':' + ref);
    return `<button class="slot ${kind} t-${c.t}${tg ? ' tgt' : ''}${pop ? ' pop' : ''}${sl.stat.sleep ? ' zz' : ''}" data-act="slot" data-p="${p}" data-ref="${ref}" aria-label="${c.n} ${left} of ${c.hp} HP">
<img class="s-art" src="${A.cardArtURI(c)}" alt=""><span class="s-top"><b>${c.n}</b>${en(c.t, 'xs')}</span>
<span class="s-st">${stBadges(sl)}</span>${c.pts > 1 ? '<span class="s-ex">★★</span>' : ''}${c.st ? `<span class="s-stg">${'I'.repeat(c.st)}</span>` : ''}
<span class="s-en">${pips(sl)}</span><span class="s-hp"><i class="${pct < 0.34 ? 'lo' : pct < 0.67 ? 'mid' : ''}" style="width:${pct * 100}%"></i><em>${left}/${c.hp}</em></span></button>`;
  }
  function barHTML(p) {
    const P = B.s.pl[p];
    const isMe = p === ME;
    const name = isMe ? 'You' : B.e.t.n;
    const img = isMe ? '' : `<img class="mini-av" src="${UI.avatarURI(B.e.t)}" alt="">`;
    const pts = [0, 1, 2].map((i) => `<i class="${i < P.pts ? 'on' : ''}"></i>`).join('');
    const turn = B.s.phase !== 'setup' && B.s.cur === p && B.s.phase !== 'over';
    return `${img}<b class="${turn ? 'turn' : ''}">${name}</b><span class="pips pt" aria-label="${P.pts} of 3 points">${pts}</span><span class="cnt" title="Cards in deck"><svg viewBox="0 0 16 16"><rect x="3" y="2" width="9" height="12" rx="2" fill="currentColor"/><rect x="5" y="1" width="9" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>${P.deck.length}</span>${isMe ? '' : `<span class="cnt" title="Cards in hand"><svg viewBox="0 0 16 16"><path d="M3 12 L6 3 L9 12 M7 12 L10 3 L13 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>${P.hand.length}</span>`}${isMe ? '' : '<button class="pause" data-act="pause" aria-label="Menu"><svg viewBox="0 0 16 16"><path d="M3 4h10M3 8h10M3 12h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>'}`;
  }
  function legalNow() {
    if (B.s.phase === 'setup' || E.who(B.s) !== ME || B.busy || B.over) return [];
    const l = E.legal(B.s);
    return B.tut ? tutFilter(l) : l;
  }
  function render() {
    if (!B || !$('#bt')) return;
    const s = B.s, P = s.pl[ME], O = s.pl[OPP];
    $('#bar-opp').innerHTML = barHTML(OPP);
    $('#bar-me').innerHTML = barHTML(ME);
    $('#ob').innerHTML = [0, 1, 2].map((i) => slotHTML(OPP, i)).join('');
    $('#oa').innerHTML = slotHTML(OPP, -1);
    $('#ma').innerHTML = slotHTML(ME, -1);
    $('#mb').innerHTML = [0, 1, 2].map((i) => slotHTML(ME, i)).join('');
    const legal = legalNow();
    const playable = new Set(legal.filter((a) => a.h !== undefined).map((a) => a.h));
    const hw = parseFloat(getComputedStyle($('#bt')).getPropertyValue('--hw')) || 60;
    $('#hand').innerHTML = P.hand.map((id, i) => `<button class="hc${playable.has(i) ? ' ok' : ''}${B.sel === i ? ' sel' : ''}" data-act="hand" data-h="${i}" aria-label="${BY[id].n}">${UI.cardHTML(BY[id], { w: hw })}</button>`).join('') || '<p class="hand-empty">No cards in hand</p>';
    // mid
    const myTurn = s.phase === 'main' && s.cur === ME && !B.busy;
    const ready = P.ez && !P.att && myTurn;
    const msg = B.over ? '' : s.phase === 'setup' ? 'Set up your critters' : s.phase === 'promote' && E.who(s) === ME ? 'Choose your next Active critter' : (s.cur === ME ? 'Your turn' : `${B.e.t.n}'s turn`);
    const hint = B.hint || '';
    $('#mid').innerHTML = `<div class="mid-t">${msg}</div><button class="mid-log" data-act="log">${hint || B.log[B.log.length - 1] || ''}</button>
<button class="orb${ready ? ' ready' : ''}${B.mode === 'orb' ? ' on' : ''} p-${P.ez || 'N'}" data-act="orb" aria-label="Energy zone">${P.ez && !P.att ? en(P.ez) : '<span>Energy</span>'}<small>${P.att ? 'used' : P.ez ? 'tap' : s.turn <= 1 ? 'none' : ''}</small></button>`;
    // actions
    const canAtk = legal.some((a) => a.a === 'attack');
    const canRet = legal.some((a) => a.a === 'retreat');
    let acts = '';
    if (B.mode === 'setup' || B.over) acts = '';
    else if (B.sel !== null || B.mode === 'orb' || B.mode === 'retreat' || B.mode === 'snipe' || B.mode === 'promote') {
      const card = B.sel !== null ? BY[P.hand[B.sel]] : null;
      const needTarget = B.targets && B.targets.length;
      acts = `${card && !needTarget ? '<button class="btn" data-act="playsel">Play card</button>' : ''}${card ? '<button class="btn ghost" data-act="infosel">Info</button>' : ''}${B.mode !== 'promote' ? '<button class="btn ghost" data-act="cancel">Cancel</button>' : ''}`;
    } else {
      acts = `<button class="btn${canAtk ? ' hot' : ''}" data-act="attackbtn" ${canAtk ? '' : 'disabled'}>Attack</button><button class="btn ghost" data-act="retreatbtn" ${canRet ? '' : 'disabled'}>Retreat</button><button class="btn ${myTurn && !tutLocked() ? '' : 'ghost'}" data-act="endturn" ${myTurn && !tutLocked() ? '' : 'disabled'}>End turn</button>`;
    }
    $('#acts').innerHTML = acts;
    // pops are one-shot
    setTimeout(() => { $$('.slot.pop').forEach((el) => el.classList.remove('pop')); }, 700);
    B.pops = [];
    tutSync();
  }
  function setHint(t) { B.hint = t || ''; const el = $('.mid-log'); if (el) el.textContent = B.hint || B.log[B.log.length - 1] || ''; }
  function say(t) { B.log.push(t); if (B.log.length > 80) B.log.shift(); const el = $('.mid-log'); if (el && !B.hint) el.textContent = t; }

  /* ================= setup phase ================= */
  function showSetup() {
    const s = B.s, P = s.pl[ME];

      ? '<span id="su-tip"></span>'

    const m = UI.modal(`<div class="su">${T ? `<div class="su-coach"><img class="co-av" src="${UI.avatarURI(COACH)}" alt=""><div><b>Coach Mira</b><p id="su-tip"></p></div></div>` : `<h3>Choose your Active critter</h3><p>${intro}</p>`}
<div class="su-row" id="su-row"></div><div class="m-btns"><button class="btn big" id="su-go" data-act="setupgo" disabled>Pick your Active</button></div></div>`, { cls: 'setup' });
    m.el.querySelector('.m-back').dataset.act = '';
    B.setupModal = m;
    B.tutIdx = tutIdx;
    const draw = () => {
      $('#su-row').innerHTML = P.hand.map((id, i) => {
        const c = BY[id], basic = c.k === 'c' && c.st === 0;
        const allowed = T ? (i === tutIdx.act || i === tutIdx.bench) : basic;
        const role = B.setupAct === i ? 'active' : B.setupBench.includes(i) ? 'bench' : '';
        const hl = T && ((B.setupAct === null && i === tutIdx.act) || (B.setupAct !== null && !B.setupBench.length && i === tutIdx.bench)) ? ' tut-hl' : '';
        return `<button class="su-c ${allowed ? '' : 'off'} ${role}${hl}" data-act="setuppick" data-h="${i}" ${allowed ? '' : 'disabled'}>${UI.cardHTML(c, { w: hw })}${role ? `<i class="role">${role === 'active' ? 'ACTIVE' : 'BENCH'}</i>` : ''}</button>`;
      }).join('');
      const go = $('#su-go');
      const ready = T ? (B.setupAct === tutIdx.act && B.setupBench.includes(tutIdx.bench)) : B.setupAct !== null;
      go.disabled = !ready;
      go.textContent = ready ? "I'm ready!" : (T ? 'Follow the coach' : 'Pick your Active');
      if (T) {
        $('#su-tip').textContent = B.setupAct === null
          ? `Welcome! Every duel starts by choosing your team. ${s.first === ME ? '' : 'Pip goes first this time. '}Tap Embrit to make it your Active critter, the one that fights first.`
          : !B.setupBench.length
            ? 'Great! Now tap Sparkpup to put it on your Bench as a backup. You can bench up to 3 Basic critters.'
            : 'Perfect. Basics are the only critters you can start with. Press "I\'m ready" to begin!';
        go.classList.toggle('tut-hl', ready);
      }
    };
    B.drawSetup = draw; draw();
    if (!UI.save().seenHelp) { UI.save().seenHelp = true; UI.persist(); }
  }

  /* ================= effects ================= */
  const slotEl = (p, ref) => $(`.slot[data-p="${p}"][data-ref="${ref}"]`);
  function fxPos(el) {
    const bt = $('#bt').getBoundingClientRect(), r = el.getBoundingClientRect();
    return { x: r.left - bt.left + r.width / 2, y: r.top - bt.top + r.height / 2, w: r.width, h: r.height };
  }
  function floatText(el, text, cls) {
    if (!el) return;
    const p = fxPos(el);
    const d = doc.createElement('div');
    d.className = 'fnum ' + (cls || '');
    d.textContent = text;
    d.style.left = p.x + 'px'; d.style.top = p.y + 'px';
    $('#fx').appendChild(d);
    setTimeout(() => d.remove(), 1400);
  }
  function banner(text, cls, ms) {
    const d = doc.createElement('div');
    d.className = 'banner ' + (cls || '');
    d.innerHTML = `<span>${text}</span>`;
    $('#fx').appendChild(d);
    setTimeout(() => d.remove(), (ms || 1100) / B.speed + 300);
    return wait(ms || 1100);
  }
  async function coin(h) {
    AU.sfx('flip');
    const d = doc.createElement('div');
    d.className = 'coin';
    d.innerHTML = `<div class="cn ${h ? 'h' : 't'}"><i class="f1"></i><i class="f2"></i></div><b>${h ? 'Heads!' : 'Tails'}</b>`;
    $('#fx').appendChild(d);
    await wait(750);
    AU.sfx(h ? 'coin' : 'tails');
    d.classList.add('done');
    await wait(520);
    d.remove();
  }
  function cardToast(id, who) {
    const d = doc.createElement('div');
    d.className = 'ctoast';
    d.innerHTML = `${UI.cardHTML(BY[id], { w: Math.min(150, UI.W * 0.36) })}<span>${who} played</span>`;
    $('#fx').appendChild(d);
    setTimeout(() => d.remove(), 1600 / B.speed);
    return wait(1250);
  }

  /* ---- attack cinematic: capture the board before the engine changes it, then build the stage info from the events ---- */
  function fxCapture(who, atk) {
    const opp = 1 - who, P = B.s.pl[who], O = B.s.pl[opp];
    if (!P.active || !O.active) return null;
    const ea = slotEl(who, -1), ed = slotEl(opp, -1);
    if (!ea || !ed) return null;
    const side = (p, sl, el) => {
      const card = BY[sl.cid], pos = fxPos(el);
      return { card, sprite: UI.bareURI(sl.cid), type: card.t, max: card.hp, hp0: E.left(sl), hp1: E.left(sl), from: pos, slotEl: el };
    };
    return { who, opp, atk, A: side(who, P.active, ea), D: side(opp, O.active, ed) };
  }
  function fxInfo(pre, evs) {
    const inf = { dmg: 0, weak: false, miss: false, ko: false, status: [], tagsA: [], tagsD: [], healA: 0, recoil: 0 };
    const k = pre.atk.fx && pre.atk.fx.k;
    evs.forEach((e) => {
      if (e.t === 'damage' && e.p === pre.opp && e.ref === -1 && !e.src && !e.snipe && !e.spread && !inf.dmg) { inf.dmg = e.n; inf.weak = !!e.weak; e.fxShown = true; }
      else if (e.t === 'damage' && e.p === pre.who && e.ref === -1 && (e.recoil || e.thorns)) { inf.recoil += e.n; e.fxShown = true; }
      else if (e.t === 'status' && e.p === pre.opp && e.ref === -1) { inf.status.push(e.st); e.fxShown = true; }
      else if (e.t === 'heal' && e.p === pre.who && e.ref === -1) { inf.healA += e.n; e.fxShown = true; }
      else if (e.t === 'ko' && e.p === pre.opp && e.ref === -1) inf.ko = true;
    });
    if (!inf.dmg && (k === 'flip0' || k === 'flipx')) inf.miss = true;
    if (k === 'shield') inf.tagsA.push('Shield up!');
    if (k === 'draw') inf.tagsA.push('Drew cards');
    if (k === 'charge') inf.tagsA.push('Energy to bench');
    if (k === 'gust' && !inf.ko && evs.some((e) => e.t === 'swap' && e.p === pre.opp)) inf.tagsD.push('Pushed out!');
    pre.A.hp1 = Math.max(0, pre.A.hp0 - inf.recoil + inf.healA);
    pre.D.hp1 = Math.max(0, pre.D.hp0 - inf.dmg);
    return inf;
  }
  async function runFx(pre, evs) {
    const info = fxInfo(pre, evs);
    const bt = $('#bt');
    if (!bt) return;
    AU.sfx('attackWhoosh');
    try {
      await CD.FX.attack({ host: bt, A: pre.A, D: pre.D, atk: pre.atk, info, mode: CD.FX.mode() === 1 ? 'quick' : 'full', speed: B.speed });
    } catch (err) { /* never let an effect bug block the game */ }
  }

  async function playEvents(evs, action, who) {
    const names = ['You', B.e.t.n];
    let lastTurn = null, sawOver = null, fxPending = !!B.fxPre;
    const fxRun = async () => { fxPending = false; const pre = B.fxPre; if (pre) await runFx(pre, evs); };
    for (const e of evs) {
      if (fxPending && !['attack', 'coin', 'log', 'draw'].includes(e.t)) await fxRun();
      if (!B || B.over && B.s.phase !== 'over') return;
      switch (e.t) {
        case 'draw': if (e.p === ME) AU.sfx('draw'); break;
        case 'coin': await coin(e.h); break;
        case 'trainer': {
          AU.sfx('ok');
          say(`${names[e.p]} played ${BY[e.id].n}.`);
          if (e.p === OPP) await cardToast(e.id, B.e.t.n);
          break;
        }
        case 'attach': {
          AU.sfx('attach'); B.pops.push(e.p + ':' + e.ref);
          say(`${names[e.p]} attached ${D.TYPES[e.type].name} energy.`); break;
        }
        case 'bench': AU.sfx('place'); B.pops.push(e.p + ':' + e.ref); say(`${names[e.p]} benched ${BY[e.cid].n}.`); break;
        case 'evolve': {
          AU.sfx('evolve'); B.pops.push(e.p + ':' + e.ref); say(`${names[e.p]} evolved into ${BY[e.cid].n}!`);
          const el = slotEl(e.p, e.ref); if (el) el.classList.add('evo');
          await wait(900); break;
        }
        case 'retreat': say(`${names[e.p]} retreated.`); break;
        case 'swap': AU.sfx('promote'); B.pops.push(e.p + ':-1'); B.pops.push(e.p + ':' + e.to); break;
        case 'promote': AU.sfx('promote'); B.pops.push(e.p + ':-1'); say(`${names[e.p]} sent out ${BY[E.slotAt(B.s.pl[e.p], -1).cid].n}.`); break;
        case 'attack': say(`${BY[e.cid].n} used ${e.name}!`); break;
        case 'damage': {
          if (e.fxShown) { say(`${names[e.p]}'s critter took ${e.n} damage${e.weak ? ' (weakness!)' : ''}.`); break; }
          const el = slotEl(e.p, e.ref);
          const big = e.n >= 70;
          AU.sfx(e.weak ? 'crit' : 'hit');
          if (B.tut && e.weak && e.p === OPP) B.tut.sawWeak = true;
          if (el) {
            el.classList.add('hit'); setTimeout(() => el.classList.remove('hit'), 450);
            floatText(el, '-' + e.n, (e.src || e.recoil || e.thorns) ? 'dot' : e.weak ? 'weak' : big ? 'big' : '');
            if (e.weak) setTimeout(() => floatText(el, 'Weakness!', 'tag'), 160);
            const sl = E.slotAt(B.s.pl[e.p], e.ref);
            const hp = el.querySelector('.s-hp i');
            if (hp) hp.style.width = Math.max(0, sl ? (E.left(sl) / BY[sl.cid].hp) * 100 : 0) + '%';
          }
          say(`${names[e.p]}'s critter took ${e.n} damage${e.weak ? ' (weakness!)' : ''}.`);
          await wait(e.src ? 420 : 520); break;
        }
        case 'heal': { if (e.fxShown) break; AU.sfx('heal'); floatText(slotEl(e.p, e.ref), '+' + e.n, 'heal'); await wait(380); break; }
        case 'status': { if (e.fxShown) { say(`${names[e.p]}'s Active critter is ${{ poison: 'poisoned', burn: 'burned', sleep: 'asleep', para: 'paralyzed' }[e.st]}.`); break; } AU.sfx('status'); floatText(slotEl(e.p, e.ref), { poison: 'Poisoned!', burn: 'Burned!', sleep: 'Asleep!', para: 'Paralyzed!' }[e.st], 'tag'); say(`${names[e.p]}'s Active critter is ${{ poison: 'poisoned', burn: 'burned', sleep: 'asleep', para: 'paralyzed' }[e.st]}.`); await wait(420); break; }
        case 'statusEnd': floatText(slotEl(e.p, -1), 'Recovered', 'heal'); break;
        case 'discardEnergy': break;
        case 'ko': {
          AU.sfx('ko');
          const el = slotEl(e.p, e.ref);
          if (el) { el.classList.add('ko'); floatText(el, 'KO!', 'ko'); }
          say(`${BY[e.cid].n} was knocked out! ${names[e.by]} scores ${e.pts}.`);
          await wait(950); break;
        }
        case 'log': say(e.msg); break;
        case 'turn': lastTurn = e; break;
        case 'over': sawOver = e; break;
        default: break;
      }
    }
    if (fxPending) await fxRun();
    render();
    if (lastTurn && !sawOver && B.s.phase !== 'setup') {
      AU.sfx('turn');
      await banner(lastTurn.p === ME ? 'Your turn' : `${B.e.t.n}'s turn`, lastTurn.p === ME ? 'me' : 'opp', 760);
    }
  }

  /* ================= acting ================= */
  async function act(a) {
    if (!B || B.busy || B.over) return false;
    B.busy = true;
    const who = E.who(B.s);
    const tutHit = who === ME && tutMatches(a);
    clearSel(true);
    let pre = null;
    if (a.a === 'attack') {
      const el = slotEl(who, -1);
      const atk = BY[B.s.pl[who].active.cid].atk[a.i];
      if (CD.FX && CD.FX.mode() > 0 && $('#bt') && root.document.visibilityState !== 'hidden') pre = fxCapture(who, atk);
      if (!pre) {
        AU.sfx('attackWhoosh');
        if (el) el.classList.add(who === ME ? 'lunge-up' : 'lunge-down');
        await banner(`${BY[B.s.pl[who].active.cid].n} used ${atk.n}!`, who === ME ? 'me' : 'opp', 820);
        if (el) el.classList.remove('lunge-up', 'lunge-down');
      }
    }
    const res = E.apply(B.s, a);
    if (!res.ok) { B.busy = false; UI.toast('That is not allowed right now.'); AU.sfx('deny'); render(); return false; }
    const evs = E.drain(B.s);
    B.fxPre = pre;
    await playEvents(evs, a, who);
    B.fxPre = null;
    B.busy = false;
    if (tutHit) tutAdvance();
    next();
    return true;
  }
  function next() {
    if (!B || B.over) return;
    if (B.s.phase === 'over') { finish(); return; }
    const p = E.who(B.s);
    B.mode = 'idle'; B.sel = null; B.targets = null; B.hint = '';
    if (p === ME) {
      if (B.s.phase === 'promote') {
        B.mode = 'promote';
        B.targets = B.s.pl[ME].bench.map((b, i) => (b ? { p: ME, ref: i, a: { a: 'promote', to: i } } : null)).filter(Boolean);
        setHint('Tap a benched critter to send it out.');
      }
      render();
    } else {
      B.mode = 'ai';
      render();
      clearTimeout(B.aiT);
      if (!tutBlocksAI()) B.aiT = setTimeout(aiStep, 650 / B.speed);
    }
  }
  async function aiStep() {
    if (!B || B.over || B.busy) return;
    if (E.who(B.s) !== OPP) return;
    let a;
    try { a = B.ai.next(B.s); } catch (err) { a = { a: 'end' }; }
    const legal = E.legal(B.s);
    const ok = legal.some((x) => JSON.stringify(x) === JSON.stringify(a));
    if (!ok) a = legal.find((x) => x.a === 'end') || legal[0];
    await act(a);
  }

  /* ================= selection logic ================= */
  function clearSel(keepRender) {
    B.sel = null; B.targets = null; B.mode = B.s.phase === 'promote' && E.who(B.s) === ME ? 'promote' : 'idle'; B.pendingAtk = null; B.hint = '';
    if (B.mode === 'promote') B.targets = B.s.pl[ME].bench.map((b, i) => (b ? { p: ME, ref: i, a: { a: 'promote', to: i } } : null)).filter(Boolean);
    if (!keepRender) render();
  }
  function selectHand(h) {
    const P = B.s.pl[ME];
    const id = P.hand[h]; if (!id) return;
    const legal = legalNow().filter((a) => a.h === h);
    B.sel = h; B.mode = 'hand';
    B.targets = null;
    if (!legal.length) { B.targets = null; setHint(B.tut && tutStep() ? 'Not that one yet. Follow the coach!' : `${BY[id].n}: can't be played right now.`); AU.sfx('deny'); render(); return; }
    AU.sfx('click');
    const c = BY[id];
    const withTo = legal.filter((a) => a.to !== undefined);
    if (withTo.length) {
      const tp = a0 => (a0.a === 'trainer' && c.fx.k === 'lure') ? OPP : ME;
      B.targets = withTo.map((a) => ({ p: tp(a), ref: a.to, a }));
      setHint(c.k === 'c' ? `Tap the critter to evolve into ${c.n}.` : `${c.n}: ${c.text} Tap a highlighted critter.`);
    } else {
      const only = legal[0];
      B.targets = [];
      B.directAct = only;
      setHint(only.a === 'bench' ? `${c.n} · HP ${c.hp} · ${c.atk.map((x) => x.n + ' ' + (x.d || '')).join(', ')}. Tap Play card to bench it.` : `${c.n}: ${c.text || ''}`);
    }
    render();
  }

  function panelFor(p, ref) {
    const sl = E.slotAt(B.s.pl[p], ref); if (!sl) return;

  function tutStep() {
